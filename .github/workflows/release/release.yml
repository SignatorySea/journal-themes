name: Release Module

on:
  push:
    tags:
      - "release-*"

env:
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Get the repository files
      - name: Check out repository
        uses: actions/checkout@v4

      # Read module ID from module.json
      - name: Get module ID
        id: module_id
        run: echo "id=$(jq -r '.id' module.json)" >> "$GITHUB_OUTPUT"

      # Get version from release tag
      - name: Set up variables
        run: |
          TAG=${GITHUB_REF/refs\/tags\//}
          VERSION=${TAG#release-}
          MODULE_ID=${{ steps.module_id.outputs.id }}

          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MODULE_ID=$MODULE_ID" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$MODULE_ID.zip" >> "$GITHUB_ENV"

          echo "RELEASE_DOWNLOAD_URL=${{ env.REPO_URL }}/releases/download/$TAG/$MODULE_ID.zip" >> "$GITHUB_ENV"
          echo "RELEASE_MANIFEST_URL=${{ env.REPO_URL }}/releases/download/$TAG/module.json" >> "$GITHUB_ENV"
          echo "LATEST_MANIFEST_URL=${{ env.REPO_URL }}/releases/latest/download/module.json" >> "$GITHUB_ENV"

          echo "Tag: $TAG"
          echo "Version: $VERSION"
          echo "Module ID: $MODULE_ID"

      # Update module.json for this release
      - name: Update module.json
        run: |
          jq \
            --arg version "$VERSION" \
            --arg download "$RELEASE_DOWNLOAD_URL" \
            --arg manifest "$LATEST_MANIFEST_URL" \
            '
            .version = $version
            | .download = $download
            | .manifest = $manifest
            ' \
            module.json > module.tmp.json

          mv module.tmp.json module.json

          cat module.json

      # Verify that the version matches the release tag
      - name: Verify version
        run: |
          MODULE_VERSION=$(jq -r '.version' module.json)

          if [[ "$MODULE_VERSION" != "${{ env.VERSION }}" ]]; then
            echo "Error: module.json version ($MODULE_VERSION) does not match tag version (${{ env.VERSION }})"
            exit 1
          fi

          echo "Version verified: $MODULE_VERSION"

      # Create the Foundry module ZIP
      - name: Create module ZIP
        run: |
          mkdir -p package/${{ env.MODULE_ID }}

          cp module.json package/${{ env.MODULE_ID }}/
          cp -r scripts package/${{ env.MODULE_ID }}/
          cp -r styles package/${{ env.MODULE_ID }}/
          cp -r images package/${{ env.MODULE_ID }}/

          cd package
          zip -r "../${{ env.ZIP_NAME }}" "${{ env.MODULE_ID }}"

      # Create GitHub Release and upload files
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          artifacts: "./module.json, ./${{ env.ZIP_NAME }}"
          generateReleaseNotes: true